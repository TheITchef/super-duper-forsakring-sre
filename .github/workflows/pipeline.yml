name: CI/CD Pipeline - Super Duper Försäkring

on:
    push:
        branches: [dev]
    pull_request:
        branches: [main]

env:
    ACR_NAME: acrsuperduperprod
    ACR_LOGIN_SERVER: acrsuperduperprod.azurecr.io
    CONTAINER_APP_NAME: ca-policy-api-prod
    RESOURCE_GROUP: rg-super-duper-forsakring
    IMAGE_NAME: policy-api

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              working-directory: app
              run: |
                  pip install -r requirements.txt
                  pip install -e .

            - name: Run tests
              working-directory: app
              run: |
                  pytest tests/ -v

    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/dev'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v1
              with:
                  creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

            - name: Login to ACR
              run: |
                  az acr login --name ${{ env.ACR_NAME }}

            - name: Build and push Docker image
              working-directory: app
              run: |
                  docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
                  docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest .
                  docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

            - name: Deploy to Container App
              run: |
                  az containerapp update \
                    --name ${{ env.CONTAINER_APP_NAME }} \
                    --resource-group ${{ env.RESOURCE_GROUP }} \
                    --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
