name: CI Pipeline - Super Duper Försäkring

on:
    push:
        branches: [dev]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              working-directory: app
              run: |
                  pip install -r requirements.txt
                  pip install -e .

            - name: Run tests
              working-directory: app
              run: |
                  pytest tests/ -v
